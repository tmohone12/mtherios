            - textbox [ref=e787]: "{ \"id\": \"entity_braavos\", \"story_id\": \"story_volantis_black_walls\", \"type\": \"location\", \"name\": \"Braavos\", \"description\": \"Wealthiest and likely most powerful Free City, hidden in the Great Lagoon at the meeting of the Narrow Sea and Shivering Sea. Braavos was founded by escaped slaves, was never part of the Valyrian Freehold, forbids slavery by its First Law, and projects power through the Sealord, Iron Bank, Arsenal, fleets, canals, courtesans, bravos, and the Faceless Men.\", \"status\": \"active\", \"visibility\": \"public\", \"state\": { \"type\": \"location\", \"llmUse\": [ \"Make Braavos feel cold, foggy, maritime, anti-slavery, financially ruthless, and civic-proud\", \"Use canals, harbor rules, the Titan, Arsenal, Iron Bank, courtesans, bravos, and religious pluralism as scene pressure\", \"Do not portray Braavos as Valyrian aristocratic in the Volantene sense\" ], \"region\": \"Northwestern Essos; Great Lagoon; Narrow Sea and Shivering Sea meeting point\", \"economy\": [ \"Iron Bank makes Braavos a kingmaking financial power and lends to foreign nations\", \"square iron coins\", \"purple hulls and sails from dark dye tied to lagoon sea snails\", \"lagoon seafood wealth: oysters, eels, crabs, clams, fish\", \"merchant ships reach distant lands including Asshai and the Jade Sea\", \"one of the world's greatest ports, open to all but slavers\" ], \"slavery\": \"forbidden\", \"terrain\": \"hundred-island lagoon city of canals, stone bridges, fog, rain, freezing rain, brackish water, grey stone, and no city walls\", \"landmarks\": [ \"Titan of Braavos\", \"Arsenal\", \"Canal of Heroes with statues of dead Sealords\", \"Long Canal with First Law engraved on its arch\", \"Drowned Town half-sunk into the lagoon\", \"Sweetwater River aqueduct and Moon Pool\", \"Purple Harbor for Braavosi ships\", \"Chequy Port for inspected arrivals\", \"Ragman's Harbor for foreign ships\", \"Isle of the Gods and House of Black and White\" ], \"hiddenInfo\": null, \"socialRules\": [ \"First Law forbids slaves, thralls, and bondsmen\", \"slavers are not welcome to dock\", \"boats replace horses for ordinary travel\", \"mummers may openly mock rulers without punishment\", \"visible swords at night invite challenge from bravos\" ], \"freeCityRank\": 1, \"historyForTone\": [ \"youngest Free City but not a Valyrian colony\", \"founded by escaped slaves who stole ships and hid in the lagoon\", \"kept secret for generations before the Uncloaking\", \"Iron Bank began from valuables hidden in an abandoned iron mine and grew into world finance\" ], \"politicalOrder\": [ \"Sealord rules for life from the Sealord's Palace\", \"successor chosen by magisters and Iron Bank keyholders through a contested process\", \"First Sword commands the Sealord's personal guard\", \"city watch patrols the canals and streets\" ], \"relatedEntries\": [ \"entity_volantis\", \"entity_yi_ti_golden_empire\" ], \"defensesAndPower\": [ \"Titan of Braavos guards lagoon entry and roars to mark time or warn of ships\", \"Arsenal can build a warship in a day\", \"Braavosi fleets dominate seas northwest of Essos\", \"mountainous/pine-covered islands and fog hide and shield the harbors\" ], \"religionAndCulture\": [ \"all gods have shrines or refuge in the city\", \"Temple of the Moonsingers is the largest temple and remembers the founders' guides\", \"House of Black and White houses the Faceless Men\", \"courtesans have barges and public fame\", \"bravos duel at night and water dancers use a refined fencing style\", \"Uncloaking festival lasts ten masked days\" ] }, \"metadata\": { \"source\": \"llm_seed_proposal\", \"updatedBy\": \"wiki-command\", \"confidence\": 0.86, \"needsReview\": false, \"localAliases\": [ \"Braavos of the Hundred Isles\", \"Secret City\", \"Bastard Daughter of Valyria\", \"The Secret City\" ], \"originalTable\": \"lorebookEntries\", \"entityResolver\": { \"reason\": \"Strong resolver match for Braavos.\", \"decision\": \"update\", \"candidates\": [ { \"name\": \"Braavos\", \"type\": \"location\", \"score\": 1, \"signals\": [ \"exact:id\", \"exact:name\", \"fuzzy:name\", \"exact:alias\", \"same:type\" ], \"entityId\": \"entity_braavos\" }, { \"name\": \"Volantis\", \"type\": \"location\", \"score\": 0.818, \"signals\": [ \"fuzzy:name\", \"same:type\" ], \"entityId\": \"entity_volantis\" }, { \"name\": \"Iron Bank of Braavos\", \"type\": \"organization\", \"score\": 0.7, \"signals\": [ \"fuzzy:name\", \"different:type\" ], \"entityId\": \"entity_iron_bank\" } ], \"confidence\": 1, \"matchedEntityId\": \"entity_braavos\" }, \"localCreatedBy\": \"user\", \"localInjection\": {}, \"originalMetadata\": { \"sourceUrl\": \"https://awoiaf.westeros.org/index.php/Braavos\", \"importedAt\": \"2026-06-14T16:01:10.485Z\", \"importedBy\": \"codex\", \"sourceLabel\": \"A Wiki of Ice and Fire: Braavos\", \"contextPolicy\": \"Compact LLM city reference: geography, rule, social logic, economy, military, landmarks, and scene-use facts only; recent book events and excess named trivia omitted unless campaign state asks for them.\" }, \"localMentionCount\": 0, \"localCreativeState\": null, \"localAdventureState\": null, \"loreManagementBlacklisted\": false }, \"source_entry_ids\": [ \"entry_source_011\" ], \"source_event_ids\": [], \"source_patch_ids\": [], \"server_version\": 1144, \"created_at\": \"2026-06-11 21:18:12+00\", \"updated_at\": \"2026-06-14 16:01:45.742+00\" }"
