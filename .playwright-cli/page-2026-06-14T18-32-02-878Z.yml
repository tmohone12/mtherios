otionalTone\": \"unresolved pressure\", \"startPosition\": 121, \"summarySource\": \"deterministic_backfill\", \"legacyKeywords\": [ \"scene transition\", \"yi ti\", \"the imperial city\", \"the golden pagoda\", \"the vermilion phoenix apartments\", \"aurion's chamber\", \"chapter\", \"continuity memory\" ], \"legacyLocations\": [ \"Yi Ti - The Imperial City, the Golden Pagoda, the Vermilion Phoenix Apartments, Aurion's Chamber\" ], \"legacyCharacters\": [ \"Balaerys Heir\", \"Vermillion Zhen Lian\" ], \"trackedEntityIds\": [ \"entity_balaerys_heir\", \"entity_e20ad393-38de-456b-a04b-173ed0f70ab1\" ], \"postChapterBuffer\": 10, \"backfilledCharactersAt\": \"2026-06-14T18:29:48.976Z\" }, \"server_version\": 1182, \"created_at\": \"2026-06-12 05:11:02.245+00\", \"updated_at\": \"2026-06-14 18:29:48.951173+00\" }"
