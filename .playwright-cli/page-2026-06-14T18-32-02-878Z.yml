-8543-be351a5dd027\" }, \"serverVersion\": 104, \"createdAt\": \"2026-06-12 04:48:28.979+00\", \"updatedAt\": \"2026-06-12 04:48:28.979+00\" }, { \"id\": \"0bef0096-170d-4319-99eb-1cbb45a55368\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"system\", \"content\": \"Terminal agent runtime required: Server LLM request timed out after 120000ms\", \"position\": 148, \"parentId\": null, \"branchId\": null, \"metadata\": {}, \"serverVersion\": 106, \"createdAt\": \"2026-06-12 04:55:37.119+00\", \"updatedAt\": \"2026-06-12 04:55:37.119+00\" }, { \"id\": \"narration_943784d1-98a8-4cde-a3e2-e32e040bbf96\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"narration\", \"content\": \"[ 🕰️ Time 22:32 | 🗓️ Day 235, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, the Vermilion Phoenix Apartments, Aurion's Chamber | 🌤️ Weather Cool, 18°C, the half-moon silvering the paper screens, the braziers down to embers ]\\n\\nLian's breath was still coming in soft, uneven pulls, her chest rising and falling against his. The flush on her cheeks had spread down her throat, a bloom of warmth that the moonlight caught and silvered. At his words, her dark eyes—still hazy, still half-lost in the receding tide of pleasure—found his and focused.\\n\\nA smile spread across her lips, slow and wondering, the smile of a girl who had walked into a story and found it stranger and sweeter than any pillow-book had promised.\\n\\n\\\"You feel good,\\\" she echoed, her voice a threadbare whisper. She lifted one trembling hand and touched his cheek, her fingers tracing the line of his jaw with a tenderness that had no place in the scheming world outside the paper screens. \\\"I did not know it would be like this. I thought it would hurt and be over. I did not know—\\\"\\n\\nShe stopped. Swallowed. Her thumb brushed the corner of his mouth, where the faint, self-deprecating twist had lived for so long it had worn a groove. It was not there now. Now there was only the slack, stunned calm of a man who had been unmade and remade in the space of a dozen heartbeats.\\n\\n\\\"I am still a fool,\\\" she whispered, but the word had no weight. \\\"But I am glad it was you. I am glad it was—\\\" She did not finish. Instead, she drew his head down and kissed him again, softer this time, slower, a seal on something that had no name yet. Her legs were still tangled with his. The ruined sheets were cool beneath them. The night outside the paper screens was very still, as if the moon itself had paused to listen.\", \"position\": 150, \"parentId\": \"entry_943784d1-98a8-4cde-a3e2-e32e040bbf96\", \"branchId\": null, \"metadata\": { \"source\": \"server_turn\", \"engineCache\": { \"hitCount\": 3, \"segments\": [ { \"hit\": true, \"kind\": \"prompt_system\", \"cacheKey\": \"engine-cache:story_volantis_black_walls:prompt_system:1a5e04a4d72a8397bcb07d505587751bd5e12e52cc415d520df8d06c68bc0716\", \"hitCount\": 72, \"missCount\": 2, \"contentHash\": \"2b23becd83243afc5ac36c678447f2db1aec019e7a5db22c9a2711f223eaea4c\", \"invalidated\": false, \"tokenEstimate\": 2496, \"dependencyCount\": 1 }, { \"hit\": false, \"kind\": \"retrieved_memory\", \"cacheKey\": \"engine-cache:story_volantis_black_walls:retrieved_memory:d35547ae94036471639374ee5b327180707c7d542282a8b37d75d945a5cb63c9\", \"hitCount\": 2, \"missCount\": 72, \"contentHash\": \"4b8b450a41dbb336e5f95730779b2372ee82bf4205c6c6df3fbf2bd193393659\", \"invalidated\": true, \"tokenEstimate\": 4407, \"dependencyCount\": 3 }, { \"hit\": false, \"kind\": \"wiki_context\", \"cacheKey\": \"engine-cache:story_volantis_black_walls:wiki_context:bbc03bb662c68095fdf22aeb3fbfdc04fe35e0f210bf5a6efa67d36fea1bb124\", \"hitCount\": 1, \"missCount\": 20, \"contentHash\": \"cf3a8a05dc4aa16f37e514d98e00c24a0ff5ab60fa5050192ea2729631c7e39f\", \"invalidated\": true, \"tokenEstimate\": 999, \"dependencyCount\": 1 }, { \"hit\": true, \"kind\": \"campaign_continuity\", \"cacheKey\": \"engine-cache:story_volantis_black_walls:campaign_continuity:19a109bf679edc14de67ba4e8035db4b487f1378a646352c9f2ca7b25410734a\", \"hitCount\": 69, \"missCount\": 5, \"contentHash\": \"73cd9d5d9e81989a2f1260262c3c4546b035cd22be5c388604688db6022fd5fb\", \"invalidated\": false, \"tokenEstimate\": 9858, \"dependencyCount\": 6 }, { \"hit\": true, \"kind\": \"tool_schema\", \"cacheKey\": \"engine-cache:story_volantis_black_walls:tool_schema:893698a9adbabc5acbdb628c070818a5067b517ad280231da74c6902eb3b8913\", \"hitCount\": 73, \"missCount\": 1, \"contentHash\": \"2d49ddf4ba001ff863fa5c8df8049b9269b84d70b898099a2ea6526d838bf5cb\", \"invalidated\": false, \"tokenEstimate\": 7, \"dependencyCount\": 1 } ], \"missCount\": 2, \"tokenEstimate\": 17767 }, \"clientTurnId\": \"943784d1-98a8-4cde-a3e2-e32e040bbf96\", \"stateExtraction\": { \"mode\": \"deferred\" }, \"generationTimings\": [ { \"model\": \"deepseek-v4-pro\", \"status\": \"success\", \"operation\": \"turn.narration\", \"serviceId\": \"narrative\", \"durationMs\": 15934, \"totalTokens\": 43556, \"requestTokens\": 42881, \"responseTokens\": 675 } ], \"memoryTokenBudget\": 2400, \"retrievedMemoryIds\": [ \"mem_8b63077b-3c6c-4430-ab7f-dfc492a68130\", \"mem_chapter_chapter_narration_a36f822f_e0da_4cd7_a0e9_c5aae260d71e_entry_31b54ade_e534_486f_8327_ddc41066c36d\", \"mem_chapter_chapter_entry_1ec7d14a_8d4a_413c_8c45_24ba223a117c_entry_a36f822f_e0da_4cd7_a0e9_c5aae260d71e\" ], \"wikiContextCitations\": [ \"[1] Chapter 3: Turn resolved <chapters/003-turn-resolved.md>\", \"[2] Chapter 4: Turn resolved <chapters/004-turn-resolved.md>\", \"[3] Event: Turn resolved <events/event-turn-resolved--event_8e.md>\", \"[4] Event: Turn resolved <events/event-turn-resolved--event_22.md>\", \"[5] Index <index.md>\" ], \"wikiContextPageCount\": 5, \"wikiContextSeedCount\": 4 }, \"serverVersion\": 107, \"createdAt\": \"2026-06-12 04:57:07.054+00\", \"updatedAt\": \"2026-06-12 04:57:07.054+00\" }, { \"id\": \"narration_7e48ac25-86ed-47fd-bc3f-a06a1a22ac2f\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"narration\", \"content\": \"[ 🕰️ Time 22:31 | 🗓️ Day 235, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, the Vermilion Phoenix Apartments, Aurion's Chamber | 🌤️ Weather Cool, 18°C, the half-moon silvering the paper screens, the braziers burning low and soft ]\\n\\nThe end came sudden and blinding, a crest that broke him open.\\n\\nAurion buried himself to the hilt, his groan smothered against Lian's throat as the release wrenched through him—hot, deep, helpless, everything he'd held tight for nineteen years unspooling in a shudder of muscle and salt. She clung to him through it, her nails scoring his back, her own climax a fluttering series of small, startled cries that vibrated against his chest like a second heartbeat.\\n\\nFor a long, suspended moment they lay locked together, breathless, slick with sweat, the cooling seed already beginning its slow trickle against her thighs. The silk sheets were ruined. The paper screens breathed in the night wind. The carved phoenixes on the headboard watched with ivory eyes. And somewhere beneath the fading thunder of his pulse, Aurion felt a door close and another open—the first death of who he had been, the first taste of something warmer than fire.\", \"position\": 147, \"parentId\": \"entry_7e48ac25-86ed-47fd-bc3f-a06a1a22ac2f\", \"branchId\": null, \"metadata\": { \"source\": \"server_turn\", \"engineCache\": { \"hitCount\": 3, \"segments\": [ { \"hit\": true, \"kind\": \"prompt_system\", \"cacheKey\": \"engine-cache:story_volantis_black_walls:prompt_system:1a5e04a4d72a8397bcb07d505587751bd5e12e52cc415d520df8d06c68bc0716\", \"hitCount\": 70, \"missCount\": 2, \"contentHash\": \"2b23becd83243afc5ac36c678447f2db1aec019e7a5db22c9a2711f223eaea4c\", \"invalidated\": false, \"tokenEstimate\": 2496, \"dependencyCount\": 1 }, { \"hit\": false, \"kind\": \"retrieved_memory\", \"cacheKey\": \"engine-cache:story_volantis_black_walls:retrieved_memory:d35547ae94036471639374ee5b327180707c7d542282a8b37d75d945a5cb63c9\", \"hitCount\": 2, \"missCount\": 70, \"contentHash\": \"6ce8ee04d6e956f562b39893e1b1694d7949e594a6fbee785b04b8577e9ecc50\", \"invalidated\": true, \"tokenEstimate\": 3551, \"dependencyCount\": 3 }, { \"hit\": true, \"kind\": \"campaign_continuity\", \"cacheKey\": \"engine-cache:story_volantis_black_walls:campaign_continuity:19a109bf679edc14de67ba4e8035db4b487f1378a646352c9f2ca7b25410734a\", \"hitCount\": 67, \"missCount\": 5, \"contentHash\": \"73cd9d5d9e81989a2f1260262c3c4546b035cd22be5c388604688db6022fd5fb\", \"invalidated\": false, \"tokenEstimate\": 9858, \"dependencyCount\": 6 }, { \"hit\": true, \"kind\": \"tool_schema\", \"cacheKey\": \"engine-cache:story_volantis_black_walls:tool_schema:893698a9adbabc5acbdb628c070818a5067b517ad280231da74c6902eb3b8913\", \"hitCount\": 71, \"missCount\": 1, \"contentHash\": \"2d49ddf4ba001ff863fa5c8df8049b9269b84d70b898099a2ea6526d838bf5cb\", \"invalidated\": false, \"tokenEstimate\": 7, \"dependencyCount\": 1 } ], \"missCount\": 1, \"tokenEstimate\": 15912 }, \"clientTurnId\": \"7e48ac25-86ed-47fd-bc3f-a06a1a22ac2f\", \"stateExtraction\": { \"mode\": \"deferred\" }, \"generationTimings\": [ { \"model\": \"deepseek-v4-pro\", \"status\": \"success\", \"operation\": \"turn.narration\", \"serviceId\": \"narrative\", \"durationMs\": 14000, \"totalTokens\": 41617, \"requestTokens\": 41073, \"responseTokens\": 544 } ], \"memoryTokenBudget\": 2400, \"retrievedMemoryIds\": [ \"mem_chapter_chapter_entry_494932ed_735f_43b6_9a2e_4ebbcbb8bb43_narration_a3703610_bac6_49f6_8a40_3f351ed44645\", \"mem_chapter_chapter_entry_source_008_narration_ef5e0eb4_fae6_4fa4_9263_826e04c75afd\", \"mem_event_event_443e391f-971b-4abc-ae7c-d207e6b360d6\" ], \"wikiContextCitations\": [], \"wikiContextPageCount\": 0, \"wikiContextSeedCount\": 0 }, \"serverVersion\": 105, \"createdAt\": \"2026-06-12 04:51:41.31+00\", \"updatedAt\": \"2026-06-12 04:51:41.31+00\" } ], \"events\": [ { \"id\": \"event_fe5b6513-4c3e-4945-8b89-d14221f165b7\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 08:25 | 🗓️ Day 140, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, a Private Chamber | 🌤️ Weather Overcast, 30°C, the frescoed dragons watching in silence ] Zhen of the House of the Vermilion Phoenix smiled—not the evaluative smile, nor the sharp smile of political calculation, but something smaller, more private. A woman whose guest had asked exactly the right question. \\\"What do I plan to do with you?\\\" She tapped the closed fan against her chin. \\\"For the first month, nothing. You will stay in this chamber—not as a prisoner, but as a convalescent. The servants will speak of the foreign merchant who survived the pirate attack that killed his crew. The eunuchs will hear this rumor and dismiss it. The sorcerer-priests will hear it and wonder. And you—\\\" She gestured with the fan toward a lacquered wardrobe on the far wall. \\\"You will learn. The language of the Golden Empire. The names of the four factions. The rituals of court. A dead dragon who cannot bow correctly at the Chrysanthemum Throne is worse than useless. He is a liability.\\\" She turned and walked to the paper screens that covered the far wall. With a single motion, she slid them aside. Light flooded the chamber—thin, overcast, but blinding after the gloom. Beyond the screens lay a balcony of carved jade, overlooking terraced gardens that climbed the hillside in a cascade of cherry trees and lotus ponds and winding stone paths. The imperial city spread below, a sea of red-tiled roofs and smoking temple incense and the distant glitter of the harbor where the *Serpent's Kiss* had burned. \\\"After the first month,\\\" she continued, her back to him, \\\"you will begin to appear. Not at court—not yet. At minor functions. A poetry recital hosted by a sympathetic noblewoman. A spring festival in the gardens of the Outer Palace. A banquet in honor of a trade delegation from Leng, where your knowledge of foreign tongues might prove useful. Each appearance will be brief, memorable, a\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 55, \"occurredTurn\": 55, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_af989da8-1c85-459c-ab45-a46279a0d23f\", \"narration_af989da8-1c85-459c-ab45-a46279a0d23f\" ], \"sourcePatchIds\": [ \"patch_b01648f4-033a-48cb-bcf8-2afc594a4fef\" ], \"metadata\": {}, \"serverVersion\": 93, \"createdAt\": \"2026-06-12 04:24:41.14+00\", \"updatedAt\": \"2026-06-12 04:24:41.14+00\" }, { \"id\": \"event_c01018f1-275b-4b3a-a236-a6988fda296e\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 10:00 | 🗓️ Day 230, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, the Vermilion Phoenix Apartments | 🌤️ Weather Cool, 22°C, autumn chrysanthemums blooming on the terraces ] Three months in the Golden Empire reshaped a man. The language came first—halting, then fluid, then precise. Aurion's tutors, a rotating cast of eunuchs and minor scholars Zhen had selected for loyalty rather than renown, drilled him in the sinuous script and musical tones of High Yi Tish. By the end of the first month, he could order a meal without pointing. By the end of the second, he could read the court gazettes and understand the gossip written between the lines. By the end of the third, he could compose a poem—a stiff, formal thing about chrysanthemums and lost sailors—that made Zhen's painted lips twitch with something approaching approval. The body came next. The needle-fog cleared after two days. The weakness faded after a week. Zhen had provided a training yard in a walled garden at the base of the pagoda, hidden from casual view by a grove of flowering quince. A swordmaster came each morning, a grizzled old soldier from the northern provinces who had lost an eye to a Dothraki arrow and spoke Valyrian in a growl. His name was Jian, and he had never asked why a foreigner with demon-eyes needed to learn the curved blade of the imperial cavalry. He simply drilled Aurion until his arms burned and his lungs screamed, and then drilled him again. The blade felt different than his old Westerosi steel—lighter, quicker, alive in the hand. By the third month, Jian had stopped scowling and started nodding. The knowledge came last, and deepest. Zhen brought him histories bound in silk, scrolls that mapped the labyrinthine genealogies of the Celestial Court, coded ledgers detailing which minister's mistress was spying for which faction, which general owed debts to which eunuch, which sorcerer-priest had predicted the boy-emperor's death three separate ti\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 57, \"occurredTurn\": 57, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_fb21549c-349e-48a8-9863-6acb225d070b\", \"narration_fb21549c-349e-48a8-9863-6acb225d070b\" ], \"sourcePatchIds\": [ \"patch_b96ad694-35a9-41e8-8595-104e2ffb02ca\" ], \"metadata\": {}, \"serverVersion\": 98, \"createdAt\": \"2026-06-12 04:29:52.184+00\", \"updatedAt\": \"2026-06-12 04:29:52.184+00\" }, { \"id\": \"event_8e12e790-80c4-4e53-8f2b-1de6ca9ce4ab\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 08:26 | 🗓️ Day 140, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, a Private Chamber | 🌤️ Weather Overcast, 30°C, paper screens still thrown wide, the gardens below stirring with morning birds ] Zhen's fan paused mid-stroke. For a moment, her painted lips parted—not in shock, but in that same flicker of surprised amusement he had drawn from her before. Then she laughed, the soft, breathy sound of wind through rice paper, and this time it touched her dark eyes with something that might have been genuine. \\\"A whore,\\\" she repeated, tasting the foreign word with evident delight. \\\"You Valyrians have such colorful tongues. In the Golden Empire, we would say you look like a tribute bride awaiting her wedding night. But whore is more honest.\\\" She snapped the fan closed and gestured toward his remaining bound wrist. \\\"I had already untied the other. You merely lacked the patience to let me finish.\\\" She leaned over the bed—close enough that the scent of plum wine and sandalwood and that bitter poppy undertone washed over him—and worked the last silk cord loose with quick, efficient fingers. The crimson silk slithered from the ivory headboard. His left arm dropped, heavy and tingling with the rush of returning blood. Zhen straightened and stepped back, fanning herself once more with slow, lazy strokes. \\\"There. Unwhored. You may sit up, if your limbs permit. The needle we used leaves the muscles weak for an hour or two—you will be clumsy. Try not to fall off the bed. It would be undignified for a dragon.\\\" She turned and walked to the lacquered table where his possessions lay. Her silver-and-crimson robes whispered against the polished floor. The white jade combs in her hair clinked softly with each step. \\\"Your clothing is in the wardrobe. Not your old things—they were bloodied and burned. I had new garments made while you slept: robes in the Yi Tish cut, but in Balaerys crimson, with black trim. You will look foreign enough to intrigue\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 56, \"occurredTurn\": 56, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_e9af91ef-3ee7-46f6-ae06-5d53b87aaccd\", \"narration_e9af91ef-3ee7-46f6-ae06-5d53b87aaccd\" ], \"sourcePatchIds\": [ \"patch_f1d92329-1b13-481f-b987-0fac91a1a798\" ], \"metadata\": {}, \"serverVersion\": 94, \"createdAt\": \"2026-06-12 04:27:21.822+00\", \"updatedAt\": \"2026-06-12 04:27:21.822+00\" }, { \"id\": \"event_093a5c3d-c15a-4679-a892-3a9bf4d28b81\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 08:15 | 🗓️ Day 140, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, a Private Chamber | 🌤️ Weather Overcast, 30°C, sandalwood incense coiling in the still air ] The woman's fan stopped its lazy tapping. For a long moment she simply looked at him, her dark, widened pupils swallowing the light, her painted lips parted just slightly—as though he had spoken a word in a language she had not expected to hear. Then she laughed. It was not the rough, genuine laugh of Xanda Qar Deeth, nor the cold, dismissive laugh of a Volantene crone. It was a soft, breathy sound, like wind through rice paper, and it did not touch her eyes. \\\"Already dead,\\\" she repeated, tasting the words. \\\"How very convenient. My uncle's soldiers killed a dead man. The sorcerer-priests dreamed of a corpse. And the candle—the glass candle, the fire of the dragonlords—you call it a trading trinket. A priceless artifact, you say, as though priceless things are ever merely artifacts.\\\" She tilted her head the other way, the white jade combs glinting. \\\"You are either the worst liar in the Golden Empire, or the most honest fool. I have not decided.\\\" She stepped closer, her silver-and-crimson robes whispering across the polished floor. The fan snapped open and she fanned herself with small, precise motions, her eyes never leaving his. \\\"The Braavosi swordsman died well. He killed four of my uncle's foo-dog soldiers before they brought him down. The scar-throated factor died poorly—weeping, begging, offering coin he did not have. The Summer Islander captain is burning on a pyre outside the harbor as we speak, her swan ship confiscated, her crew in chains.\\\" She paused, letting the words settle like stones. \\\"You are the only one I kept. Do you know why?\\\" She closed the fan with a sharp click and leaned over the bed, her face inches from his. Her breath smelled of plum wine and something bitter underneath—poppy, perhaps, or the same alchemical tear the trading post's ledger h\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 51, \"occurredTurn\": 51, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_31b54ade-e534-486f-8327-ddc41066c36d\", \"narration_31b54ade-e534-486f-8327-ddc41066c36d\" ], \"sourcePatchIds\": [ \"patch_6067d9a5-8f50-4c84-acab-758c975df2b0\" ], \"metadata\": {}, \"serverVersion\": 89, \"createdAt\": \"2026-06-12 04:11:33.117+00\", \"updatedAt\": \"2026-06-12 04:11:33.117+00\" }, { \"id\": \"event_52d10523-aab3-4238-ad5c-63f6eb5f8acc\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 08:20 | 🗓️ Day 140, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, a Private Chamber | 🌤️ Weather Overcast, 30°C, incense coiling, the fan motionless ] The fan stopped. The woman in silver-and-crimson did not move. Her dark, widened pupils had contracted to pinpricks. The hand that held the fan, steady and precise moments ago, had whitened at the knuckles. For a span of heartbeats—five, ten, a silence deeper than the temple gongs—she simply stared at the bound, near-naked man on the bed as though seeing him for the first time. \\\"Aegon Targaryen,\\\" she said, and the name came out differently than the others she'd spoken. Less accent. More care. The name of a dynasty, spoken with the deliberate respect of someone who had studied the genealogies of every great house that might one day be useful. \\\"The sixth of that name. The babe who was butchered in the Red Keep at the end of the Usurper's War. Only—not butchered. Smuggled. Shipped across the Narrow Sea in a crate of silks, or a wine cask, or whatever lie they told the dockmasters. And the Balaerys house took you in.\\\" A pause. \\\"And bled you full of their own dead.\\\" She stepped back from the bed. Not in fear—her movements were too controlled for fear—but in the manner of a jeweler stepping back from a gem that had revealed itself to be something rarer, stranger, and potentially radioactive. \\\"Four cousins. The matriarch. All to graft dragonlord blood into a Targaryen prince who already had more of it than anyone living.\\\" She shook her head, a small, tight motion. \\\"My tutors said the Volantene Old Blood were desperate. They did not say they were insane.\\\" She paused. \\\"Or brilliant. It depends on whether the graft took. Whether you are a miracle or an abomination. From the eyes—\\\" She gestured at his face with the closed fan. \\\"I would guess miracle.\\\" She turned away, her robes rustling, and walked to a lacquered table on the far side of the room. On it, arranged with ritual precisio\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 52, \"occurredTurn\": 52, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_64352dc4-70c4-4593-aeca-2becca4c8019\", \"narration_64352dc4-70c4-4593-aeca-2becca4c8019\" ], \"sourcePatchIds\": [ \"patch_37737462-6393-45fa-8b57-5ff12574a824\" ], \"metadata\": {}, \"serverVersion\": 90, \"createdAt\": \"2026-06-12 04:17:28.841+00\", \"updatedAt\": \"2026-06-12 04:17:28.841+00\" }, { \"id\": \"event_9659194e-34a4-4e2b-abb1-78c88c55cfc0\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 08:21 | 🗓️ Day 140, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, a Private Chamber | 🌤️ Weather Overcast, 30°C, incense settling like a shroud ] Zhen's fingers, cool and dry, lingered at the silk cord she had just loosened. She straightened, fan tapping once against her palm, and regarded him with that careful, appraising gaze—a collector examining a new acquisition, one that had just proven infinitely more valuable than first estimated. \\\"One more thing,\\\" she said, as if remembering a minor detail in a trade negotiation. \\\"I had word sent. A merchant junk out of Yin, bound for the Cinnamon Straits with a cargo the Celestial Minister himself signed off on. Its captain carries a sealed missive from the Office of Barbarian Affairs—very official, very authenticated—reporting the destruction of a Volantene swan ship in the Jade Sea. All hands lost. The bodies unrecoverable. The Balaerys second son among them.\\\" She paused, letting the weight of it settle. The fan opened, a soft rustle of paper and bamboo. The frescoed dragons on the ceiling seemed to lean down, listening. \\\"In a matter of months, the news will reach Volantis. Your mother will grieve—or not. Your brother will inherit—or already has. The Crimson Spire will hang mourning silk. The Forty Families will murmur their condolences and then return to their feuds. And Aurion Balaerys will be dead to the world.\\\" The fan moved slowly now, a lazy metronome. \\\"To the world, but not to me. Not to the sorcerer-priests who dreamed of you. Not to anyone who matters east of the Jade Gates.\\\" She stepped back toward the lacquered table, the white jade combs in her hair catching the light like scattered stars. Her fingers brushed the silk-wrapped glass candle—still cold, still dark—and then the jade comb of Xanda Qar Deeth, which she lifted and turned over with idle curiosity. \\\"Dead men have no obligations. No mothers to please. No houses to serve. Dead men are free, Aegon Targaryen. \", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 53, \"occurredTurn\": 53, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_8d35b87e-d47b-42fc-939d-df5ab4892a5d\", \"narration_8d35b87e-d47b-42fc-939d-df5ab4892a5d\" ], \"sourcePatchIds\": [ \"patch_87751a34-f1d7-43d3-ae89-3b603258e443\" ], \"metadata\": {}, \"serverVersion\": 91, \"createdAt\": \"2026-06-12 04:19:46.215+00\", \"updatedAt\": \"2026-06-12 04:19:46.215+00\" }, { \"id\": \"event_12a52878-8152-479b-8a84-c34c4e31ddc2\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 08:22 | 🗓️ Day 140, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, a Private Chamber | 🌤️ Weather Overcast, 30°C, dawn light struggling through paper screens ] Zhen's fan stilled. For the first time since he'd woken, the calculating mask slipped—not into warmth, but into something sharper, a flicker of genuine surprise that she did not trouble to hide. Her dark, widened eyes narrowed slightly, reassessing him with new precision. \\\"You are bound to a bed in a foreign empire. Your companions are dead. Your ship is ash. The world will soon believe you drowned. And your first question—your very first—is how you can serve my rise.\\\" She closed the fan with a soft click and tapped it against her painted lower lip. \\\"That is not the response of a prince. That is the response of a man who has been a second son too long and learned to make himself useful before he is made dead.\\\" She turned away and walked toward the lacquered table where his possessions lay. Her robes, silver and crimson, caught the weak dawn light like a fish swimming through murky water. The white jade combs in her hair clinked softly as she moved. \\\"The Golden Empire is second to none in power,\\\" she said, almost dismissively. \\\"That is what the trade envoys write in their ledgers. That is what the Volantene Old Blood believe. It is true, in the way a mountain is true—vast, immovable, and utterly incapable of growing.\\\" She turned back, her painted lips curving. \\\"The Golden Empire has been second to none for five thousand years. In those five thousand years, it has not expanded a single league. The boy-emperor sits his throne and dreams of purging foreigners, while the eunuchs skim harbor taxes and the sorcerer-priests whisper of omens and the Celestial Ministers scheme for their own provinces. The empire is not a sword. It is a rotting dragon, fat and sleepy, coiled around a hoard it no longer knows how to spend.\\\" She crossed back to the bed, her steps slow and delib\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 54, \"occurredTurn\": 54, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_0bcaedf9-def4-43ab-82ba-8dfbe248637d\", \"narration_0bcaedf9-def4-43ab-82ba-8dfbe248637d\" ], \"sourcePatchIds\": [ \"patch_3d8ec76b-2c5f-45b4-b823-2dd5d91c1588\" ], \"metadata\": {}, \"serverVersion\": 92, \"createdAt\": \"2026-06-12 04:22:01.292+00\", \"updatedAt\": \"2026-06-12 04:22:01.292+00\" }, { \"id\": \"event_443e391f-971b-4abc-ae7c-d207e6b360d6\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 22:31 | 🗓️ Day 235, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, the Vermilion Phoenix Apartments, Aurion's Chamber | 🌤️ Weather Cool, 18°C, the half-moon silvering the paper screens, the braziers burning low and soft ] She gasped when he entered her—a sharp, high note that broke into something deeper as he sank home. Her body arched beneath him, the thin shift rucked up around her hips, her fingers digging hard into the muscle of his shoulders. The heat of her was overwhelming, a tight, slick, living warmth that seemed to pull him deeper with every pulse of her heart. He moaned. The sound came out rougher than he'd meant, stripped of all pretense, all the careful control he'd worn like armor since Volantis. *This feels better than I thought.* The words were a whisper somewhere in his skull, swallowed by the rhythm of their bodies. The silk sheets tangled beneath them, already damp with sweat. The night air was cool, but between their skins there was nothing but fire. Lian wrapped her legs around him, drawing tighter, and her breath came in broken syllables—his name, or part of it, or simply a sound that had no language. The braziers guttered. The half-moon crept across the paper screens. And Aurion Balaerys—Aegon Targaryen, the dead man walking, the dragon in the shadow silk cloak—moved inside her with an urgency that felt older than ambition, older than bloodlines, older than the glass candle cold in its silk on the nightstand. For a long while, there was nothing in the world but skin and heat and the soft, urgent music of two people discovering one of the few pleasures that made this wretched world worth enduring.\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 63, \"occurredTurn\": 63, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_f1acdc1d-57f0-423a-8543-be351a5dd027\", \"narration_f1acdc1d-57f0-423a-8543-be351a5dd027\" ], \"sourcePatchIds\": [ \"patch_0dc2e264-3bf1-4091-a2c2-de3d71b522b6\" ], \"metadata\": {}, \"serverVersion\": 104, \"createdAt\": \"2026-06-12 04:48:44.141+00\", \"updatedAt\": \"2026-06-12 04:48:44.141+00\" }, { \"id\": \"event_0a30dd62-01d7-4d36-abc2-725227e96169\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 22:32 | 🗓️ Day 235, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, the Vermilion Phoenix Apartments, Aurion's Chamber | 🌤️ Weather Cool, 18°C, the half-moon silvering the paper screens, the braziers down to embers ] Lian's breath was still coming in soft, uneven pulls, her chest rising and falling against his. The flush on her cheeks had spread down her throat, a bloom of warmth that the moonlight caught and silvered. At his words, her dark eyes—still hazy, still half-lost in the receding tide of pleasure—found his and focused. A smile spread across her lips, slow and wondering, the smile of a girl who had walked into a story and found it stranger and sweeter than any pillow-book had promised. \\\"You feel good,\\\" she echoed, her voice a threadbare whisper. She lifted one trembling hand and touched his cheek, her fingers tracing the line of his jaw with a tenderness that had no place in the scheming world outside the paper screens. \\\"I did not know it would be like this. I thought it would hurt and be over. I did not know—\\\" She stopped. Swallowed. Her thumb brushed the corner of his mouth, where the faint, self-deprecating twist had lived for so long it had worn a groove. It was not there now. Now there was only the slack, stunned calm of a man who had been unmade and remade in the space of a dozen heartbeats. \\\"I am still a fool,\\\" she whispered, but the word had no weight. \\\"But I am glad it was you. I am glad it was—\\\" She did not finish. Instead, she drew his head down and kissed him again, softer this time, slower, a seal on something that had no name yet. Her legs were still tangled with his. The ruined sheets were cool beneath them. The night outside the paper screens was very still, as if the moon itself had paused to listen.\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 65, \"occurredTurn\": 65, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_943784d1-98a8-4cde-a3e2-e32e040bbf96\", \"narration_943784d1-98a8-4cde-a3e2-e32e040bbf96\" ], \"sourcePatchIds\": [ \"patch_5aa5c7d9-11d9-40d4-b20a-49770b272653\" ], \"metadata\": {}, \"serverVersion\": 107, \"createdAt\": \"2026-06-12 04:57:23.314+00\", \"updatedAt\": \"2026-06-12 04:57:23.314+00\" }, { \"id\": \"event_2b8800f3-3991-4a73-95d4-ee042b94d83e\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 19:00 | 🗓️ Day 12, First Moon, 297 AC | 📍 Location Qarth - The Pureborn's Terrace, Xanda's Private Chambers | 🌤️ Weather Cool, 18°C, a dry wind from the Red Waste rattling the shutters ] The jade comb sat on her nightstand, catching the last light of the dying sun. Xanda Qar Deeth had stared at it for three days now, ever since the Yi Tish merchant had pressed it into her palm with a bow and a murmur of condolences. She had not cried. Pureborn women did not cry—not where the servants could see, not where the eunuchs could carry tales to her grandfather, not where the city's thousand schemers could scent weakness like sharks scenting blood. She had accepted the comb, dismissed the merchant with a gift of coin he did not deserve, and walked to her chambers with her spine straight and her painted lips set in a line that dared anyone to speak. But at night, when the braziers burned low and the fountains below fell silent, she stared at the jade crescent and remembered. `He ate the honeyed locusts.` The memory came unbidden, sharp as a blade's edge. A boy—no, a man—with fire-gold eyes and salt-stained crimson, sitting on her grandfather's best silk cushions and telling her the truth when every other guest had offered lies. *They also told me not to eat these honeyed locusts, you will smile and smile and smile and decide to kill me.* And then he had eaten them anyway. Three of them. With the casual disregard of a man who no longer feared death because death had been chasing him for so long it had become a familiar. She had told her grandfather that night that she had dined with the most interesting foreigner in a decade. Her grandfather had grunted and told her not to bed him without negotiating a trade deal first. She had laughed then. She was not laughing now. The jade comb had been a whim. A token, she'd told herself. A bit of theater to soften a dragonlord's son toward House Qar Deeth. But he had taken it with those gold-burning eyes and said something a\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 58, \"occurredTurn\": 58, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_8aa25ac8-8403-41d1-b8b9-ab7bee4aaf6d\", \"narration_8aa25ac8-8403-41d1-b8b9-ab7bee4aaf6d\" ], \"sourcePatchIds\": [ \"patch_64f0a225-429f-4f5e-9604-c7d7a2e69fd8\" ], \"metadata\": {}, \"serverVersion\": 99, \"createdAt\": \"2026-06-12 04:34:13.265+00\", \"updatedAt\": \"2026-06-12 04:34:13.265+00\" }, { \"id\": \"event_2c701a8a-7bd5-4ccb-b2b7-9d79abe2e297\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 02:00 | 🗓️ Day 13, First Moon, 297 AC | 📍 Location Qarth - The Pureborn's Terrace, Xanda's Private Chambers | 🌤️ Weather Cold, 14°C, deep night, the fountains silent, the braziers burned to embers ] She had not meant to sleep. The wine had been meant to dull the ache, not open a door. But somewhere between the third goblet and the fourth, the silk cushions swallowed her, and the waking world slipped away into a darkness deeper than the Red Waste at midnight. And in that darkness, she dreamed. She stood on a shore she had never seen—black sand, fine as powdered glass, stretching to a sea that did not move. The water was silver, still as a mirror, and the sky above it was the color of a bruise. Not the Jade Sea. Not any sea she knew. The air smelled of cold stone and old fire and something else, something she had smelled only once before: the dry, electric tang of a glass candle freshly lit. A figure stood at the water's edge, his back to her, his shoulders draped in a cloak of shadow silk that rippled like liquid smoke. The hem of the cloak stirred the black sand but left no mark. The figure's hair was silver-gold, unmistakable even in the strange light. And when he turned— Fire-gold eyes. The same eyes she had watched over the rim of her crystal goblet. The same eyes that had held hers without flinching when he'd told her his family wanted him dead. But they were brighter now. Burned brighter. As though something behind them had been kindled and was still growing. Aurion Balaerys looked at her. His face was thinner than she remembered, harder, but his mouth had that same faint, self-deprecating twist she had found so unsettling in life. He did not speak. He did not need to. His eyes said everything: *Not dead. Not yet.* He raised one hand—the same hand that had held her jade comb—and pointed upward. Xanda looked. The sun above the silver sea was wrong. It hung low and huge, a great golden eye filling half the sky, but it was cracked. A jagged line ran \", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 59, \"occurredTurn\": 59, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_bea4947a-3144-4b40-b022-36cc497b45a5\", \"narration_bea4947a-3144-4b40-b022-36cc497b45a5\" ], \"sourcePatchIds\": [ \"patch_e2d2a98b-9d5b-4bc5-9a89-6715f35de935\" ], \"metadata\": {}, \"serverVersion\": 100, \"createdAt\": \"2026-06-12 04:38:17.834+00\", \"updatedAt\": \"2026-06-12 04:38:17.834+00\" }, { \"id\": \"event_b8484e3a-3314-4fe2-9435-238bd902d324\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 22:30 | 🗓️ Day 235, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, the Vermilion Phoenix Apartments, Aurion's Chamber | 🌤️ Weather Cool, 18°C, a half-moon silvering the paper screens ] Her name was Lian, of the House of the Yellow Lotus, a minor branch of a minor branch that clung to the edges of the Celestial Court like ivy to a crumbling wall. She was seventeen, slender as a reed, with skin the color of pale honey and hair that fell straight as black water past her shoulders. Her eyes were dark and curious and had been watching him for weeks—across the garden during poetry recitals, through the lattice screens during late-night banquets, from the corner of every room where lesser nobility gathered to gossip and scheme. She was not a spy. Zhen had confirmed it: a girl from a house too poor to bribe servants, too insignificant to interest the eunuchs, too romantic for her own good. She had read too many pillow-books about foreign princes and hidden dragons. She had seen Aurion's golden eyes and decided, with the reckless certainty of youth, that he was the hero of a story she wanted to be in. And tonight, after three cups of rice wine and a moonlit walk through the chrysanthemum terraces, she had followed him back to his chamber. The paper screens were drawn. The braziers cast long shadows across the silk-draped bed. The jade comb of Xanda Qar Deeth and the white jade combs of Zhen sat side by side on the nightstand, watching like silent judges. Lian did not notice them. Her eyes were on him. She knelt on the silk sheets in a tangle of embroidered robes, her painted lips parted, her breath coming quick. Her fingers, trembling only slightly, reached for the sash of her outer gown. The silk whispered as it loosened. \\\"I have never—\\\" she started, her High Yi Tish soft and accented, the voice of a girl who had rehearsed this moment in a hundred daydreams and now found it terrifyingly real. \\\"I know you are a foreigner. I know m\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 60, \"occurredTurn\": 60, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_b385a1ec-d39a-4df6-b611-7347d893b095\", \"narration_b385a1ec-d39a-4df6-b611-7347d893b095\" ], \"sourcePatchIds\": [ \"patch_a2f5a80b-a701-4e02-b55f-fbaf82eea7a4\" ], \"metadata\": {}, \"serverVersion\": 101, \"createdAt\": \"2026-06-12 04:42:00.57+00\", \"updatedAt\": \"2026-06-12 04:42:00.57+00\" }, { \"id\": \"event_bd3fb504-fbe4-4cf3-9231-e2a7c9f7d22b\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 22:31 | 🗓️ Day 235, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, the Vermilion Phoenix Apartments, Aurion's Chamber | 🌤️ Weather Cool, 18°C, a half-moon silvering the paper screens ] Lian's fingers stilled on her sash. For a long moment she simply stared at him—not the adoring, half-dreaming stare of the poetry recitals, but something rawer, caught off-guard. The silk of her outer robe whispered loose, pooling at her knees on the bed. \\\"Your first time,\\\" she repeated, as though the words were a foreign coin she was turning over in her palm, trying to read its value. Her high, soft voice had dropped half an octave. \\\"You—the dead man walking, the foreigner with demon-eyes, the one the sorcerer-priests dreamed of—you have never—?\\\" She stopped. Swallowed. A flush crept up her pale honey throat, staining her cheeks the color of plum blossoms. Then, unexpectedly, she laughed—a small, nervous, delighted laugh that had nothing of the courtier in it. \\\"I thought I would be the fool tonight,\\\" she whispered. \\\"The trembling virgin who did not know where to put her hands. And instead you tell me we are two fools together.\\\" Her fingers, steadier now, resumed their work on her sash. The outer robe fell away entirely, a heap of yellow silk embroidered with lotuses, leaving her in a thin shift the color of moonlight. Her dark hair spilled across bare shoulders. \\\"Good. I am glad. I did not want to be taught. I wanted—\\\" She hesitated, searching for the word. \\\"I wanted to discover. Together. Is that foolish?\\\"\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 61, \"occurredTurn\": 61, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_6a90a759-dfc3-40e1-b5e8-2eb66aafbd57\", \"narration_6a90a759-dfc3-40e1-b5e8-2eb66aafbd57\" ], \"sourcePatchIds\": [ \"patch_47480a82-5d32-4b37-9529-4bb186586889\" ], \"metadata\": {}, \"serverVersion\": 102, \"createdAt\": \"2026-06-12 04:43:35.422+00\", \"updatedAt\": \"2026-06-12 04:43:35.422+00\" }, { \"id\": \"event_d4ec00ae-5a5c-4af6-ba35-f2d02fd9bf66\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": \"committed\", \"title\": \"Turn resolved\", \"body\": \"[ 🕰️ Time 22:31 | 🗓️ Day 235, Tenth Moon, 296 AC | 📍 Location Yi Ti - The Imperial City, the Golden Pagoda, the Vermilion Phoenix Apartments, Aurion's Chamber | 🌤️ Weather Cool, 18°C, the half-moon silvering the paper screens, the braziers warm and low ] His mouth found hers in answer. Lian made a small sound—not a gasp, not a sigh, but something caught between—and her fingers, which had been so steady on her sash, clutched at his bare shoulders with the sudden, uncalculated grip of a woman who had just discovered that kissing was not like the pillow-books at all. It was warmer. Messier. More terrifying and more real. She tasted of the rice wine they had shared on the chrysanthemum terrace, sweet and slightly burnt, and under that, something clean and young that was simply her. Her lips were softer than he had expected, hesitant at first, then pressing back with a bravery she was only half-feeling. The thin shift she still wore brushed against his chest, moonlight-colored silk that caught on his skin. Her hair, dark as ink and loose now, fell forward around their faces like a curtain, shutting out the braziers, the watching combs, the whole scheming world beyond the paper screens.\", \"actorEntityIds\": [], \"targetEntityIds\": [], \"locationId\": null, \"locationIds\": [], \"factionIds\": [], \"threadIds\": [], \"visibility\": \"player_known\", \"createdTurn\": 62, \"occurredTurn\": 62, \"scheduledTurn\": null, \"worldTime\": null, \"memoryImpact\": {}, \"sourceEntryIds\": [ \"entry_4692fe5c-8e83-4b29-ac3f-81d36347c7b3\", \"narration_4692fe5c-8e83-4b29-ac3f-81d36347c7b3\" ], \"sourcePatchIds\": [ \"patch_873734b2-381b-43cf-93e3-868ff396fed5\" ], \"metadata\": {}, \"serverVersion\": 103, \"createdAt\": \"2026-06-12 04:44:26.65+00\", \"updatedAt\": \"2026-06-12 04:44:26.65+00\" }, { \"id\": \"event_9c53f606-0253-4cfa-82dd-31796bfbd0b9\", \"storyId\": \"story_volantis_black_walls\", \"type\": \"scene_transition\", \"status\": 