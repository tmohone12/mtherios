name: mythengine
services:
  mythengine-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MYTHENGINE_DB_NAME:-mythengine}
      POSTGRES_USER: ${MYTHENGINE_DB_USER:-mythengine}
      POSTGRES_PASSWORD: ${MYTHENGINE_DB_PASSWORD:-mythengine}
    ports:
      - "127.0.0.1:${MYTHENGINE_DB_PORT:-5433}:5432"
    volumes:
      - mythengine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYTHENGINE_QDRANT_PORT:-6335}:6333"
      - "127.0.0.1:6336:6334"
    volumes:
      - mythengine_qdrant:/qdrant/storage
volumes:
  mythengine_pgdata:
  mythengine_qdrant:
